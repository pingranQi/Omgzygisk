[package]
name = "omgzygisk-loader-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[profile.release]
# Prefer a small Android runtime footprint over peak compile-time throughput.
opt-level = "z"
codegen-units = 1
panic = "abort"
strip = "symbols"
