name: Verify

on:
  push:
  pull_request:

jobs:
  zygote-jni:
    name: Zygote JNI hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Nubia JNI signatures and generated hooks
        run: python3 loader/src/injector/test_jni_hooks.py

  rustcore:
    name: Rust core tests and static library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
      - name: Run Rust loader-core tests
        working-directory: loader/rustcore
        run: cargo test --locked
      - name: Build Rust loader-core static library
        working-directory: loader/rustcore
        run: cargo build --release --locked

  webui:
    name: WebUI checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: zygiskd/webui
        run: pnpm install --frozen-lockfile
      - name: Format and lint
        working-directory: zygiskd/webui
        run: pnpm check:biome
      - name: Type-check
        working-directory: zygiskd/webui
        run: pnpm type-check
      - name: Build
        working-directory: zygiskd/webui
        run: pnpm build
      - name: Unit guards
        working-directory: zygiskd/webui
        run: pnpm test
      - name: Install Playwright browsers
        working-directory: zygiskd/webui
        run: pnpm exec playwright install --with-deps chromium
      - name: Behaviour and accessibility
        working-directory: zygiskd/webui
        run: pnpm test:e2e

  android:
    name: Android release package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.85.0
          target: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 3.5.4 --locked
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: zygiskd/webui/pnpm-lock.yaml
      - name: Build release module
        env:
          RUSTFLAGS: ""
        run: bash ./gradlew :module:zipRelease --no-daemon --console=plain
      - name: Upload module ZIP
        uses: actions/upload-artifact@v4
        with:
          name: onyxzygisk-release
          path: module/build/outputs/release/*.zip
